openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assistant
    description: Source-grounded finance assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /assistant/chat:
    post:
      operationId: streamFinanceAssistant
      tags: [assistant]
      summary: Ask a question about loaded finance data
      description: Classifies a natural-language question, retrieves or calculates from the loaded datasets, and streams a source-linked answer using server-sent events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantChatRequest"
      responses:
        "200":
          description: "Server-sent events: delta contains content; result contains sources, navigation and context; done commits completion. An error event invalidates partial results."
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid or oversized question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChatError"
        "429":
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChatError"
        "502":
          description: The assistant could not complete the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChatError"
        "503":
          description: The assistant service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChatError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AssistantChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 2000
      required:
        - role
        - content
    AssistantChatRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
        history:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/AssistantChatMessage"
        context:
          $ref: "#/components/schemas/AssistantConversationContext"
      required:
        - message
    AssistantChatError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        context:
          $ref: "#/components/schemas/AssistantConversationContext"
      required:
        - error
    AssistantSelection:
      type: object
      additionalProperties: false
      required: [airlines, financialYear, reportingPeriod]
      properties:
        airlines:
          type: array
          maxItems: 4
          items:
            type: string
            maxLength: 160
        financialYear:
          type: [string, "null"]
          maxLength: 160
        reportingPeriod:
          type: [string, "null"]
          maxLength: 160
    AssistantQueryPlan:
      type: object
      additionalProperties: false
      required: [intent, airlines, metric, financialYear, reportingPeriod, ratioId, rankingType, tableId, rankLimit, trend, navigateTo]
      properties:
        intent:
          type: string
          enum: [metric_lookup, ratio_lookup, aviation_ranking, aviation_analysis, navigation, help, unsupported]
        airlines:
          type: array
          maxItems: 4
          items:
            type: string
            maxLength: 160
        metric:
          type: [string, "null"]
          maxLength: 160
        financialYear:
          type: [string, "null"]
          maxLength: 160
        reportingPeriod:
          type: [string, "null"]
          maxLength: 160
        ratioId:
          type: [string, "null"]
          maxLength: 160
        rankingType:
          type: [string, "null"]
          enum: [mlas, borrowers, capitalMarkets, commercial, null]
        tableId:
          type: [string, "null"]
          maxLength: 160
        rankLimit:
          type: [integer, "null"]
        trend:
          type: boolean
        navigateTo:
          type: [string, "null"]
          enum: [financials, statements, ratios, analytics, aviationFinance, null]
    AssistantConversationContext:
      type: object
      additionalProperties: false
      required: [selection]
      properties:
        selection:
          $ref: "#/components/schemas/AssistantSelection"
        request:
          $ref: "#/components/schemas/AssistantQueryPlan"

